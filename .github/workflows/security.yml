name: Security Scan - SCA

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  sca-scan:
    name: Quét lỗ hổng thư viện (SCA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --ignore-scripts --legacy-peer-deps

      # === SCA bằng npm audit: liệt kê lỗ hổng thư viện ===
      - name: Run npm audit (SCA)
        run: |
          echo "===== KẾT QUẢ QUÉT LỖ HỔNG THƯ VIỆN (npm audit) ====="
          npm audit --audit-level=high

      # === Bổ sung: Trivy quét để đối chiếu ===
      - name: Run Trivy SCA scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln'
          severity: 'CRITICAL,HIGH'
          format: 'table'
